[package]
name = "engine-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Combustion engine simulation for the game: a Rust port of engine-sim by Ange Yaghi"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exactly engine-sim's arithmetic, for tests/reference.rs (slower in WebAssembly).
reference = []
# The pipes of duct.rs stepped in parallel (native builds: the reference simulation).
parallel = ["dep:rayon"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "float_roundtrip"] }
rayon = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
